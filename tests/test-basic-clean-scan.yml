name: Test basic clean scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory with a minimal package.json
        run: |
          mkdir -p /tmp/clean-scan-target
          cat > /tmp/clean-scan-target/package.json << 'EOF'
          {
            "name": "clean-test-project",
            "version": "1.0.0",
            "dependencies": {
              "lodash": "^4.17.21"
            }
          }
          EOF
          echo "Created clean scan target"

      - id: action
        uses: .
        with:
          fail-on-critical: 'false'
          fail-on-high: 'false'
          fail-on-any: 'false'
          scan-lockfiles: 'false'
          scan-node-modules: 'false'
          output-format: 'text'
          working-directory: '/tmp/clean-scan-target'

      - name: Assert status output is set
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          if [ -z "$STATUS" ]; then
            echo "FAIL: status output is empty"
            exit 1
          fi
          if [ "$STATUS" != "clean" ] && [ "$STATUS" != "affected" ]; then
            echo "FAIL: status must be 'clean' or 'affected', got: $STATUS"
            exit 1
          fi
          echo "PASS: status is '$STATUS'"

      - name: Assert affected-count output is set
        env:
          COUNT: ${{ steps.action.outputs.affected-count }}
        run: |
          echo "affected-count: $COUNT"
          if [ -z "$COUNT" ]; then
            echo "FAIL: affected-count output is empty"
            exit 1
          fi
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: affected-count is not a non-negative integer: $COUNT"
            exit 1
          fi
          echo "PASS: affected-count is '$COUNT'"

      - name: Assert security-findings-count output is set
        env:
          FINDINGS: ${{ steps.action.outputs.security-findings-count }}
        run: |
          echo "security-findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: security-findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: security-findings-count is not a non-negative integer: $FINDINGS"
            exit 1
          fi
          echo "PASS: security-findings-count is '$FINDINGS'"

      - name: Assert scan-time output is set
        env:
          SCAN_TIME: ${{ steps.action.outputs.scan-time }}
        run: |
          echo "scan-time: $SCAN_TIME"
          if [ -z "$SCAN_TIME" ]; then
            echo "FAIL: scan-time output is empty"
            exit 1
          fi
          if ! echo "$SCAN_TIME" | grep -qE '^[0-9]+$'; then
            echo "FAIL: scan-time is not a non-negative integer: $SCAN_TIME"
            exit 1
          fi
          echo "PASS: scan-time is '$SCAN_TIME' ms"

      - name: Assert results output is set and is JSON array
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          echo "$RESULTS" | python3 -c "import sys, json; data = json.load(sys.stdin); assert isinstance(data, list), 'Expected JSON array'"
          echo "PASS: results output is a valid JSON array"

      - name: Assert allowlisted-count output is set
        env:
          ALLOWLISTED: ${{ steps.action.outputs.allowlisted-count }}
        run: |
          echo "allowlisted-count: $ALLOWLISTED"
          if [ -z "$ALLOWLISTED" ]; then
            echo "FAIL: allowlisted-count output is empty"
            exit 1
          fi
          if ! echo "$ALLOWLISTED" | grep -qE '^[0-9]+$'; then
            echo "FAIL: allowlisted-count is not a non-negative integer: $ALLOWLISTED"
            exit 1
          fi
          echo "PASS: allowlisted-count is '$ALLOWLISTED'"
