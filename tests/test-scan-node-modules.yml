name: Test scan-node-modules flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a project with node_modules
        run: |
          mkdir -p /tmp/nm-project/node_modules/safe-package
          cat > /tmp/nm-project/package.json <<'EOF'
          {
            "name": "nm-test-project",
            "version": "1.0.0",
            "dependencies": {
              "safe-package": "1.0.0"
            }
          }
          EOF
          cat > /tmp/nm-project/node_modules/safe-package/package.json <<'EOF'
          {
            "name": "safe-package",
            "version": "1.0.0"
          }
          EOF
      - id: action
        uses: .
        with:
          fail-on-critical: 'false'
          fail-on-high: 'false'
          fail-on-any: 'false'
          scan-lockfiles: 'false'
          scan-node-modules: 'true'
          output-format: 'text'
          working-directory: '/tmp/nm-project'
      - name: Assert action completed successfully
        env:
          STATUS: ${{ steps.action.outputs.status }}
          AFFECTED: ${{ steps.action.outputs.affected-count }}
          SCAN_TIME: ${{ steps.action.outputs.scan-time }}
        run: |
          echo "status: $STATUS"
          echo "affected-count: $AFFECTED"
          echo "scan-time: $SCAN_TIME"
          if [ -z "$STATUS" ]; then
            echo "FAIL: status output is empty"
            exit 1
          fi
          if [ -z "$SCAN_TIME" ]; then
            echo "FAIL: scan-time output is empty"
            exit 1
          fi
          if ! echo "$AFFECTED" | grep -qE '^[0-9]+$'; then
            echo "FAIL: affected-count is not a non-negative integer: $AFFECTED"
            exit 1
          fi
          echo "PASS: node_modules scan completed with status=$STATUS, affected=$AFFECTED"
