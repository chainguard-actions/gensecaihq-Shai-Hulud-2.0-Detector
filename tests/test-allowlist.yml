name: Test allowlist feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Node.js 24 via nvm
        run: |
          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm install 24 --no-progress
            nvm use 24
            NODE_BIN="$(nvm which 24)"
            NODE_DIR="$(dirname "$NODE_BIN")"
            echo "$NODE_DIR" >> "$GITHUB_PATH"
            echo "Node.js 24 installed: $($NODE_BIN --version)"
          else
            echo "nvm not found, using system node: $(node --version 2>/dev/null || echo 'not found')"
          fi
      - name: Create project directory and allowlist file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/allowlist-project"
          cat > "$GITHUB_WORKSPACE/allowlist-project/package.json" << 'EOF'
          {
            "name": "allowlist-project",
            "version": "1.0.0",
            "dependencies": {
              "express": "^4.18.0"
            }
          }
          EOF
          # Allowlist must be a JSON array (not an object)
          printf '[]' > "$GITHUB_WORKSPACE/allowlist-project/.test-allowlist.json"
          echo "Project and allowlist file created"
      - id: action
        uses: .
        with:
          fail-on-critical: 'false'
          fail-on-high: 'false'
          fail-on-any: 'false'
          scan-lockfiles: 'true'
          scan-node-modules: 'false'
          output-format: 'json'
          working-directory: 'allowlist-project'
          allowlist-path: '.test-allowlist.json'
          ignore-allowlist: 'false'
          warn-on-allowlist: 'false'
      - name: Assert allowlisted-count output is set
        env:
          ALLOWLISTED: ${{ steps.action.outputs.allowlisted-count }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "allowlisted-count: $ALLOWLISTED"
          echo "status: $STATUS"
          if [ -z "$ALLOWLISTED" ]; then
            echo "FAIL: allowlisted-count output is empty"
            exit 1
          fi
          if ! echo "$ALLOWLISTED" | grep -qE '^[0-9]+$'; then
            echo "FAIL: allowlisted-count is not a non-negative integer: $ALLOWLISTED"
            exit 1
          fi
          echo "PASS: allowlisted-count=$ALLOWLISTED"
