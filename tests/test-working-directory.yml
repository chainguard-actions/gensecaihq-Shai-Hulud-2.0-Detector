name: Test working-directory option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          fail-on-critical: 'false'
          fail-on-high: 'false'
          fail-on-any: 'false'
          scan-lockfiles: 'false'
          scan-node-modules: 'false'
          output-format: 'text'
          working-directory: '${{ github.workspace }}/tests/fixtures/clean'

      - name: Assert status output is set
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          if [ -z "$STATUS" ]; then
            echo "FAIL: status output is empty"
            exit 1
          fi
          echo "PASS: status is '$STATUS'"

      - name: Assert scan completed for subdirectory
        env:
          STATUS: ${{ steps.action.outputs.status }}
          COUNT: ${{ steps.action.outputs.affected-count }}
        run: |
          echo "status: $STATUS"
          echo "affected-count: $COUNT"
          if [ "$STATUS" != "clean" ]; then
            echo "FAIL: expected status 'clean' for clean fixture directory but got '$STATUS'"
            exit 1
          fi
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: expected affected-count '0' for clean fixture directory but got '$COUNT'"
            exit 1
          fi
          echo "PASS: subdirectory scan completed cleanly"
