name: Test fail-on-any with clean repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean working directory with no npm packages
        run: |
          mkdir -p /tmp/clean-project
          echo '{}' > /tmp/clean-project/package.json

      - id: scan
        uses: .
        with:
          fail-on-critical: 'true'
          fail-on-high: 'false'
          fail-on-any: 'false'
          scan-lockfiles: 'true'
          scan-node-modules: 'false'
          output-format: 'text'
          working-directory: '/tmp/clean-project'

      - name: Assert scan completed and status is clean
        env:
          STATUS: ${{ steps.scan.outputs.status }}
          COUNT: ${{ steps.scan.outputs.affected-count }}
        run: |
          echo "status: $STATUS"
          echo "affected-count: $COUNT"
          if [ -z "$STATUS" ]; then
            echo "FAIL: status output is empty"
            exit 1
          fi
          if [ "$STATUS" != "clean" ]; then
            echo "FAIL: expected status 'clean' for empty project, got '$STATUS'"
            exit 1
          fi
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: expected affected-count '0' for empty project, got '$COUNT'"
            exit 1
          fi
          echo "PASS: clean project correctly identified as clean"

      - name: Assert allowlisted-count output is set
        env:
          ALLOWLISTED: ${{ steps.scan.outputs.allowlisted-count }}
        run: |
          echo "allowlisted-count: $ALLOWLISTED"
          if [ -z "$ALLOWLISTED" ]; then
            echo "FAIL: allowlisted-count output is empty"
            exit 1
          fi
          echo "PASS: allowlisted-count=$ALLOWLISTED"
