name: Test SARIF output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a clean package.json
        run: |
          mkdir -p /tmp/sarif-test-project
          cat > /tmp/sarif-test-project/package.json << 'EOF'
          {
            "name": "sarif-test-project",
            "version": "1.0.0",
            "dependencies": {
              "react": "^18.2.0"
            }
          }
          EOF
      - id: action
        uses: .
        with:
          fail-on-critical: 'false'
          fail-on-high: 'false'
          fail-on-any: 'false'
          scan-lockfiles: 'false'
          scan-node-modules: 'false'
          output-format: 'sarif'
          working-directory: '/tmp/sarif-test-project'
      - name: Assert sarif-file output is set
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          echo "PASS: sarif-file=$SARIF_FILE"
      - name: Assert sarif file exists and is valid JSON
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "Checking sarif file: $SARIF_FILE"
          if [ ! -f "$SARIF_FILE" ]; then
            echo "FAIL: sarif file does not exist at $SARIF_FILE"
            exit 1
          fi
          python3 -c "import sys, json; json.load(open('$SARIF_FILE'))" || {
            echo "FAIL: sarif file is not valid JSON"
            exit 1
          }
          echo "PASS"
      - name: Assert status output is set
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          if [ -z "$STATUS" ]; then
            echo "FAIL: status output is empty"
            exit 1
          fi
          echo "PASS: status=$STATUS"
