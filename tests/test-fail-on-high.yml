name: Test fail-on-high option with clean repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          fail-on-critical: 'false'
          fail-on-high: 'true'
          fail-on-any: 'false'
          scan-lockfiles: 'false'
          scan-node-modules: 'false'
          output-format: 'text'
          working-directory: '${{ github.workspace }}/tests/fixtures/clean'

      - name: Assert status is clean
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          if [ "$STATUS" != "clean" ]; then
            echo "FAIL: expected status 'clean' but got '$STATUS'"
            exit 1
          fi
          echo "PASS: status is clean"

      - name: Assert affected-count is 0
        env:
          COUNT: ${{ steps.action.outputs.affected-count }}
        run: |
          echo "affected-count: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: expected affected-count '0' but got '$COUNT'"
            exit 1
          fi
          echo "PASS: affected-count is 0"

      - name: Assert scan-time is set and numeric
        env:
          SCAN_TIME: ${{ steps.action.outputs.scan-time }}
        run: |
          echo "scan-time: $SCAN_TIME"
          if [ -z "$SCAN_TIME" ]; then
            echo "FAIL: scan-time output is empty"
            exit 1
          fi
          if ! echo "$SCAN_TIME" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: scan-time '$SCAN_TIME' is not a numeric value"
            exit 1
          fi
          echo "PASS: scan-time is valid"
