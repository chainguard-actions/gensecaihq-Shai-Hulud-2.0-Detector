name: Test SARIF output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Node.js 24 via nvm
        run: |
          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm install 24 --no-progress
            nvm use 24
            NODE_BIN="$(nvm which 24)"
            NODE_DIR="$(dirname "$NODE_BIN")"
            echo "$NODE_DIR" >> "$GITHUB_PATH"
            echo "Node.js 24 installed: $($NODE_BIN --version)"
          else
            echo "nvm not found, using system node: $(node --version 2>/dev/null || echo 'not found')"
          fi
      - name: Create a clean project directory to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sarif-project"
          cat > "$GITHUB_WORKSPACE/sarif-project/package.json" << 'EOF'
          {
            "name": "sarif-project",
            "version": "1.0.0",
            "dependencies": {
              "express": "^4.18.0"
            }
          }
          EOF
      - id: action
        uses: .
        with:
          fail-on-critical: 'false'
          fail-on-high: 'false'
          fail-on-any: 'false'
          scan-lockfiles: 'true'
          scan-node-modules: 'false'
          output-format: 'sarif'
          working-directory: 'sarif-project'
      - name: Assert sarif-file output is set and file exists
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "sarif-file: $SARIF_FILE"
          echo "status: $STATUS"
          if [ -z "$SARIF_FILE" ]; then
            echo "FAIL: sarif-file output is empty"
            exit 1
          fi
          if [ ! -f "$SARIF_FILE" ]; then
            echo "FAIL: sarif file does not exist at path: $SARIF_FILE"
            exit 1
          fi
          echo "PASS: sarif file exists at $SARIF_FILE"
      - name: Assert SARIF file is valid JSON with required schema fields
        env:
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: |
          echo "Validating SARIF file: $SARIF_FILE"
          python3 - "$SARIF_FILE" << 'PYEOF'
          import sys, json
          filepath = sys.argv[1]
          with open(filepath) as f:
              data = json.load(f)
          has_fields = '$schema' in data or 'version' in data or 'runs' in data
          assert has_fields, 'Missing SARIF fields'
          print('SARIF structure OK')
          PYEOF
          echo "PASS: SARIF file is valid"
