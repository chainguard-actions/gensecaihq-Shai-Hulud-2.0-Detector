name: Test fail-on-critical with clean repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          fail-on-critical: 'true'
          fail-on-high: 'false'
          fail-on-any: 'false'
          scan-lockfiles: 'true'
          scan-node-modules: 'false'
          output-format: 'text'
          working-directory: '.'

      - name: Assert action succeeded (no critical issues in clean repo)
        env:
          STATUS: ${{ steps.action.outputs.status }}
          COUNT: ${{ steps.action.outputs.affected-count }}
        run: |
          echo "status: $STATUS"
          echo "affected-count: $COUNT"
          if [ "$STATUS" != "clean" ]; then
            echo "FAIL: expected status 'clean' but got '$STATUS'"
            exit 1
          fi
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: expected affected-count '0' but got '$COUNT'"
            exit 1
          fi
          echo "PASS: action succeeded with fail-on-critical=true on clean repo"

      - name: Assert security-findings-count is zero or numeric
        env:
          FINDINGS: ${{ steps.action.outputs.security-findings-count }}
        run: |
          echo "security-findings-count: $FINDINGS"
          if [ -z "$FINDINGS" ]; then
            echo "FAIL: security-findings-count output is empty"
            exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: security-findings-count '$FINDINGS' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: security-findings-count is numeric: $FINDINGS"
